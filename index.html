  <script>
    const preElement = document.getElementById('lyrics');
    const lines = preElement.textContent.split('\n');
  
    preElement.innerHTML = lines
      .map((line, index) =>
        `<p class="${index % 2 === 0 ? 'odd-line' : 'even-line'}">${line.trimStart()}</p>`
      )
      .join('\n');
  </script>
